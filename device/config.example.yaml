# Pollen device configuration.
# Copy to config.yaml and edit. Any key left out falls back to the default in pollen_device/config.py.

device_id: pollen-01

# auto  = use real hardware when running on a Raspberry Pi, mock everything otherwise
# true  = always mock (laptop development)
# false = always real hardware (fails loudly if something is missing)
mock: auto

# Where images and the local database go. Relative paths are relative to this file.
data_dir: ./data

pins:                     # BCM GPIO numbers (NOT physical pin numbers) - see docs/wiring.md
  stepper: [17, 27, 22, 23]   # ULN2003 IN1..IN4  (physical pins 11, 13, 15, 16)
  fan: 18                     # MOSFET gate for fan (physical pin 12)
  led: 24                     # LED through a 47 ohm resistor (physical pin 18)

stepper:
  half_step: true         # 28BYJ-48: ~4096 half-steps per output shaft revolution
  step_delay_s: 0.0015    # lower = faster; below ~0.001 the motor starts skipping
  release_after_move: true  # de-energise coils after moving (motor stays cool; gearbox holds position)
  invert_direction: false # flip if "forward" winds the tape the wrong way

fan:
  pwm: false              # brushless fans often behave badly with PWM on the power line; start with on/off
  pwm_frequency: 25
  duty: 1.0               # used only when pwm: true

camera:
  resolution: [4056, 3040]  # full HQ camera resolution
  exposure_us: 2000       # fixed exposure (0 = auto exposure). Fixed is better for comparable images.
  analogue_gain: 1.0
  save_dng: false         # also save the raw sensor data (~18 MB each) - useful for lensless reconstruction later
  led_settle_s: 0.5       # wait after LED on before capturing
  preview_width: 1014     # width of the live preview in the web UI
  # Image tuning. All of these can also be changed in the web UI; changes there are kept
  # across restarts and override the values here.
  awb: true               # auto white balance. false = use the colour gains below
  colour_gain_red: 2.0
  colour_gain_blue: 2.0
  brightness: 0.0         # -1..1, 0 = normal
  contrast: 1.0           # 1 = normal
  saturation: 1.0         # 1 = normal, 0 = greyscale
  sharpness: 1.0          # 1 = normal, 0 = no sharpening (better for measuring raw shapes)
  noise_reduction: high_quality  # off | fast | high_quality

cycle:
  enabled: true
  start_paused: true      # scheduler starts paused after boot; press Resume in the web UI
  interval_min: 30        # time between the start of two cycles
  blow_s: 600             # how long the fan blows on each tape section
  pitch_steps: 1500       # how far the tape advances per cycle (calibrate! see README)
  camera_offset_cycles: 1 # distance fan->camera measured in pitches (1 = advance once, then photograph)

upload:
  enabled: false
  server_url: http://192.168.1.10:8000   # base URL of the server in server/
  token: change-me        # must match the token for this device_id on the server
  interval_s: 30
  timeout_s: 120
  delete_after_upload: false
  heartbeat: true

web:
  host: 0.0.0.0
  port: 8080
  password: ""            # set to require HTTP basic auth (user name: anything)

log_file: pollen.log      # relative to data_dir; empty = no log file
