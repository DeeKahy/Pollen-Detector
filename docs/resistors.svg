<text x="430" y="212" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">red · red · brown · gold</text>
<line x1="620" y1="170" x2="880" y2="170" stroke="var(--lead)" stroke-width="4"/>
<rect x="660" y="150" width="180" height="40" rx="18" fill="#7fb4e0" stroke="#0004"/>
<rect x="684" y="150" width="12" height="40" fill="#d0201a" stroke="#0003"/>
