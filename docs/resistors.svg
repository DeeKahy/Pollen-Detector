<text x="430" y="342" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">brown · black · yellow · gold</text>
<line x1="620" y1="300" x2="880" y2="300" stroke="var(--lead)" stroke-width="4"/>
<rect x="660" y="280" width="180" height="40" rx="18" fill="#7fb4e0" stroke="#0004"/>
