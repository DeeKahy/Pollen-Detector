<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>svg{--bg:#f7f8f5;--ink:#1d211b;--mut:#646b60;--line:#d6dbd0;--lead:#9a9a9a}@media (prefers-color-scheme:dark){svg{--bg:#141713;--ink:#e6eae2;--mut:#9aa293;--line:#3a4137;--lead:#777}}</style>
<rect width="1000" height="780" fill="var(--bg)"/>
<text x="30" y="42" font-size="24" font-weight="700" fill="var(--ink)" text-anchor="start">Resistor colours for the pollen build</text>
<text x="30" y="68" font-size="13.5" font-weight="normal" fill="var(--mut)" text-anchor="start">Start reading at the end where the bands are close together. The band on its own at the other end doesn't matter here.</text>
<text x="320" y="112" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">4 bands (usually beige)</text>
<text x="640" y="112" font-size="14" font-weight="700" fill="var(--ink)" text-anchor="start">5 bands (usually blue)</text>
<line x1="30" y1="115" x2="970" y2="115" stroke="var(--line)"/>
<text x="30" y="166" font-size="26" font-weight="700" fill="var(--ink)" text-anchor="start">220 Ω</text>
<text x="30" y="190" font-size="13" font-weight="normal" fill="var(--mut)" text-anchor="start">fan: GPIO pin to MOSFET</text>
<line x1="300" y1="170" x2="560" y2="170" stroke="var(--lead)" stroke-width="4"/>
<rect x="340" y="150" width="180" height="40" rx="18" fill="#e6cf9e" stroke="#0004"/>
<rect x="364" y="150" width="12" height="40" fill="#d0201a" stroke="#0003"/>
<rect x="388" y="150" width="12" height="40" fill="#d0201a" stroke="#0003"/>
