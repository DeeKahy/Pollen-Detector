<text x="430" y="472" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">yellow · violet · black · gold</text>
<line x1="620" y1="430" x2="880" y2="430" stroke="var(--lead)" stroke-width="4"/>
<rect x="660" y="410" width="180" height="40" rx="18" fill="#7fb4e0" stroke="#0004"/>
<rect x="684" y="410" width="12" height="40" fill="#f5d000" stroke="#0003"/>
<rect x="708" y="410" width="12" height="40" fill="#7b3fb0" stroke="#0003"/>
<rect x="732" y="410" width="12" height="40" fill="#111" stroke="#0003"/>
<rect x="756" y="410" width="12" height="40" fill="#c9a227" stroke="#0003"/>
<rect x="804" y="410" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<text x="750" y="472" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">yellow · violet · black · gold · brown</text>
<line x1="30" y1="505" x2="970" y2="505" stroke="var(--line)"/>
<text x="30" y="556" font-size="26" font-weight="700" fill="var(--ink)" text-anchor="start">150 Ω</text>
<text x="30" y="580" font-size="13" font-weight="normal" fill="var(--mut)" text-anchor="start">red or green LED instead</text>
<line x1="300" y1="560" x2="560" y2="560" stroke="var(--lead)" stroke-width="4"/>
<rect x="340" y="540" width="180" height="40" rx="18" fill="#e6cf9e" stroke="#0004"/>
<rect x="364" y="540" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<rect x="388" y="540" width="12" height="40" fill="#1f9a3a" stroke="#0003"/>
