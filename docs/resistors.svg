<rect x="756" y="280" width="12" height="40" fill="#f07a10" stroke="#0003"/>
<rect x="804" y="280" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<text x="750" y="342" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">brown · black · black · orange · brown</text>
<line x1="30" y1="375" x2="970" y2="375" stroke="var(--line)"/>
<text x="30" y="426" font-size="26" font-weight="700" fill="var(--ink)" text-anchor="start">47 Ω</text>
<text x="30" y="450" font-size="13" font-weight="normal" fill="var(--mut)" text-anchor="start">white LED</text>
<line x1="300" y1="430" x2="560" y2="430" stroke="var(--lead)" stroke-width="4"/>
<rect x="340" y="410" width="180" height="40" rx="18" fill="#e6cf9e" stroke="#0004"/>
