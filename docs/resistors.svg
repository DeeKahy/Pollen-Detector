<rect x="484" y="540" width="12" height="40" fill="#c9a227" stroke="#0003"/>
<text x="430" y="602" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">brown · green · brown · gold</text>
<line x1="620" y1="560" x2="880" y2="560" stroke="var(--lead)" stroke-width="4"/>
<rect x="660" y="540" width="180" height="40" rx="18" fill="#7fb4e0" stroke="#0004"/>
<rect x="684" y="540" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<rect x="708" y="540" width="12" height="40" fill="#1f9a3a" stroke="#0003"/>
<rect x="732" y="540" width="12" height="40" fill="#111" stroke="#0003"/>
<rect x="756" y="540" width="12" height="40" fill="#111" stroke="#0003"/>
<rect x="804" y="540" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<text x="750" y="602" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">brown · green · black · black · brown</text>
<line x1="30" y1="650" x2="970" y2="650" stroke="var(--line)"/>
<text x="30" y="680" font-size="14" font-weight="600" fill="var(--ink)" text-anchor="start">Easiest check: measure it with a multimeter on the Ω setting before you put it in.</text>
<text x="30" y="704" font-size="14" font-weight="normal" fill="var(--ink)" text-anchor="start">Don't mix up the 220 Ω and the 100 kΩ. If they swap places, the fan never turns on.</text>
<text x="30" y="728" font-size="14" font-weight="normal" fill="var(--mut)" text-anchor="start">Resistors work either way round.</text>
</svg>