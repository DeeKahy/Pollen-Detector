<rect x="756" y="150" width="12" height="40" fill="#111" stroke="#0003"/>
<rect x="804" y="150" width="12" height="40" fill="#7b3f12" stroke="#0003"/>
<text x="750" y="212" font-size="12" font-weight="normal" fill="var(--mut)" text-anchor="middle">red · red · black · black · brown</text>
<line x1="30" y1="245" x2="970" y2="245" stroke="var(--line)"/>
<text x="30" y="296" font-size="26" font-weight="700" fill="var(--ink)" text-anchor="start">100 kΩ</text>
<text x="30" y="320" font-size="13" font-weight="normal" fill="var(--mut)" text-anchor="start">fan: MOSFET to GND</text>
