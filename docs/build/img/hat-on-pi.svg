<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
<style>
svg{--bg:#f7f8f5;--card:#ffffff;--ink:#1d211b;--mut:#646b60;--line:#c9cfc2;--pcb:#1f6f43;--hat:#1d2024}
@media (prefers-color-scheme:dark){svg{--bg:#141713;--card:#1d211b;--ink:#e6eae2;--mut:#9aa293;--line:#3a4137;--pcb:#2b7a4e;--hat:#2a2e33}}
text{font-family:system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
</style>
<rect width="1200" height="600" fill="var(--bg)"/>
<text x="30" y="40" font-size="22" text-anchor="start" font-weight="800" fill="var(--ink)">Putting the HAT on the Pi</text>
<text x="30" y="64" font-size="14" text-anchor="start" font-weight="normal" fill="var(--mut)">Side view, not to scale. Power off. Do the camera ribbon first: the HAT covers the camera port.</text>
<rect x="140" y="430" width="620" height="16" rx="3" fill="var(--pcb)" stroke="#0d3a22" stroke-width="1.5" />
<text x="450.0" y="476" font-size="15" text-anchor="middle" font-weight="700" fill="var(--ink)">Raspberry Pi 3 B+</text>
<rect x="640" y="360" width="120" height="70" rx="3" fill="#c9cdd1" stroke="#888" stroke-width="1.5" />
<text x="700" y="400" font-size="12" text-anchor="middle" font-weight="700" fill="#333">USB / LAN</text>
<rect x="177" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="191" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="205" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="219" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="233" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="247" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="261" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="275" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="289" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="303" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="317" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="331" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="345" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="359" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="373" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="387" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="401" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="415" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="429" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="443" y="396" width="6" height="34" rx="1" fill="#d9c27a" stroke="none" stroke-width="1.5" />
<rect x="172" y="420" width="282" height="10" rx="1" fill="#111" stroke="none" stroke-width="1.5" />
<text x="320" y="500" font-size="12" text-anchor="middle" font-weight="normal" fill="var(--mut)">40-pin header (2 rows of 20)</text>
<rect x="520" y="408" width="36" height="22" rx="2" fill="#ddd" stroke="#777" stroke-width="1.5" />
<text x="538" y="500" font-size="12" text-anchor="middle" font-weight="normal" fill="var(--mut)">CAMERA port</text>
<rect x="140" y="230" width="480" height="14" rx="3" fill="var(--hat)" stroke="#000" stroke-width="1.5" />
<text x="380" y="178" font-size="15" text-anchor="middle" font-weight="700" fill="var(--ink)">Proto HAT</text>
<rect x="172" y="244" width="282" height="44" rx="2" fill="#111" stroke="none" stroke-width="1.5" />
<text x="320" y="272" font-size="12" text-anchor="middle" font-weight="700" fill="#ddd">socket (underneath)</text>
<rect x="526" y="229" width="24" height="16" rx="6" fill="var(--bg)" stroke="none" stroke-width="1.5" />
<path d="M538 408 L 538 210 C 538 140, 670 110, 900 110" fill="none" stroke="#e8dcb5" stroke-width="10"/>
<text x="910" y="115" font-size="13" text-anchor="start" font-weight="700" fill="var(--ink)">to the camera</text>
<polyline points="320,300 320,384" fill="none" stroke="#e8770e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="320.0,384.0 314.8,373.2 325.2,373.2" fill="#e8770e"/>
<circle cx="514" cy="380" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="514" y="385" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">1</text>
<circle cx="514" cy="210" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="514" y="215" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">2</text>
<circle cx="296" cy="350" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="296" y="355" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">3</text>
<circle cx="660" cy="237" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="660" y="242" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">4</text>
<circle cx="820" cy="250" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="820" y="255" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">1</text>
<text x="842" y="246" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">Ribbon into the Pi's CAMERA port, blue</text>
<text x="842" y="262" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">side towards the USB ports. Close the</text>
<text x="842" y="278" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">latch.</text>
<circle cx="820" cy="312" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="820" y="317" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">2</text>
<text x="842" y="308" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">Thread the ribbon up through the slot in</text>
<text x="842" y="324" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">the HAT.</text>
<circle cx="820" cy="374" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="820" y="379" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">3</text>
<text x="842" y="370" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">Line the socket up over ALL 40 pins, both</text>
<text x="842" y="386" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">rows, no pins left over at either end.</text>
<circle cx="820" cy="436" r="13" fill="#e8770e" stroke="none" stroke-width="0"/>
<text x="820" y="441" font-size="14" text-anchor="middle" font-weight="800" fill="#fff">4</text>
<text x="842" y="432" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">Press straight down, evenly, until the</text>
<text x="842" y="448" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">socket is fully on. The HAT lies over the</text>
<text x="842" y="464" font-size="12.5" text-anchor="start" font-weight="normal" fill="var(--ink)">Pi; the USB end sticks out.</text>
<text x="30" y="580" font-size="13" text-anchor="start" font-weight="normal" fill="var(--mut)">Wrong row or one pin off: 5V can end up on a GPIO pin and kill it. Look along the header from both ends before you press.</text>
</svg>
