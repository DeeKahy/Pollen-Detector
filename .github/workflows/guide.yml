name: Build guide website

# Builds the build guide (mkdocs.yml, pages in docs/) with MkDocs Material.
# Pull requests: only checks that it builds. Push to main: also publishes it to GitHub Pages
# at https://deekahy.github.io/Pollen-Detector/
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".

on:
  pull_request:
    paths: [docs/**, mkdocs.yml, .github/workflows/guide.yml]
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, .github/workflows/guide.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs<2" mkdocs-material mkdocs-callouts   # MkDocs 2 drops plugins
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
